 <div class="report-grid"><section class="chart-card"><h3>📈 مقارنة الإيرادات والمصروفات</h3>${chartBars(labels,ins,outs)}<div class="chart-legend"><span><i class="legend-dot" style="background:#159b69"></i>الإيرادات</span><span><i class="legend-dot" style="background:#e05b58"></i>المصروفات</span></div></section><section class="chart-card"><h3>🍩 توزيع المصروفات حسب النوع</h3>${donutChart(catItems)}</section>
 <section class="chart-card"><h3>🏗️ ربحية المشاريع خلال الفترة</h3>${profits.length?profits.map(x=>`<div style="margin:10px 0"><div style="display:flex;justify-content:space-between;gap:8px;font-size:.85rem"><b>${esc(x.name)}</b><b style="color:${x.profit>=0?'#159b69':'#e05b58'}">${money(x.profit)}</b></div><div style="height:9px;background:var(--bd);border-radius:9px;overflow:hidden;margin-top:5px"><div style="height:100%;width:${Math.abs(x.profit)/maxProfit*100}%;background:${x.profit>=0?'#159b69':'#e05b58'};border-radius:9px"></div></div></div>`).join(''):'<p class="mu">لا توجد حركات مرتبطة بالمشاريع في الفترة المحددة.</p>'}</section><section class="chart-card"><h3>📊 حالة المشاريع الحالية</h3>${status.map(x=>`<div style="display:flex;align-items:center;gap:10px;margin:13px 0"><span style="width:100px;font-size:.85rem">${x.label}</span><div style="height:12px;flex:1;background:var(--bd);border-radius:10px;overflow:hidden"><div style="height:100%;width:${D.p.length?x.value/D.p.length*100:0}%;background:${x.label==='مكتمل'?'#159b69':x.label==='قيد التنفيذ'?'#3b82f6':'#f59e0b'}"></div></div><b>${x.value}</b></div>`).join('')}<p class="chart-sub">يعرض حالة جميع المشاريع الحالية، وليس المشاريع المنشأة خلال الفترة فقط.</p></section></div>
 <h3>ملخص المشاريع في الفترة المحددة</h3>${tbl(['المشروع','الإيرادات المحصلة','المصروفات','صافي الربح النقدي'],profits.map(x=>`<tr><td>${esc(x.name)}</td><td>${money(x.inc)}</td><td>${money(x.out)}</td><td><b>${money(x.profit)}</b></td></tr>`))}`;

async function restoreLocal(id){const x=await backupReq('readonly',st=>st.get(id));if(x?.payload)ask('سيتم استبدال البيانات الحالية بالنسخة المختارة. تأكد من تنزيل نسخة حديثة أولًا. هل تريد المتابعة؟',()=>restorePayload(x.payload))}
function imp(i){const f=i.files[0];if(!f)return;if(f.size>100*1024*1024){toast('حجم النسخة أكبر من الحد المسموح (100 ميجابايت)','e');i.value='';return}const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||(!o.data&&!Array.isArray(o.c)))throw Error('format');ask('سيتم استبدال بيانات النظام الحالية بالنسخة المستوردة. أنشئ نسخة احتياطية أولًا. هل تريد المتابعة؟',()=>restorePayload(o))}catch(e){toast('ملف النسخة غير صالح أو غير مدعوم','e')}i.value=''};r.onerror=()=>toast('تعذرت قراءة الملف','e');r.readAsText(f)}
async function restorePayload(o){try{const data=o.data||o;if(!Array.isArray(data.c)||!Array.isArray(data.p)||!Array.isArray(data.m)||!Array.isArray(data.f))throw Error('بيانات النسخة غير مكتملة');if(SH)throw Error('الاستعادة الكاملة متاحة حاليًا في الوضع المحلي فقط');const fileMap={};if(o.files&&IDB){for(const [old,v] of Object.entries(o.files)){const key=uid()+uid();let value=v;if(typeof v==='string'&&v.startsWith('data:'))value=blob(v);await idbp('readwrite',st=>st.put(value,key));fileMap['idb:'+old]='idb:'+key}}
 const replaceRefs=x=>{if(Array.isArray(x))return x.map(replaceRefs);if(x&&typeof x==='object'){const y={};for(const [k,v] of Object.entries(x))y[k]=(k==='u'&&typeof v==='string'&&fileMap[v])?fileMap[v]:replaceRefs(v);return y}return x};
 D.c=replaceRefs(data.c);D.p=replaceRefs(data.p);D.m=replaceRefs(data.m);D.f=replaceRefs(data.f);if(data.s)D.s={...DS,...data.s};if(Array.isArray(data.u)&&data.u.length)D.u=data.u;if(Array.isArray(data.audit))D.audit=data.audit;D.c.forEach(x=>{if(!Array.isArray(x.att))x.att=[]});if(!save())throw Error('تعذر حفظ البيانات بعد الاستعادة');applySet();closeM();enterTab('dash');audit('استعادة نسخة احتياطية','system',o.createdAt||'ملف خارجي');toast('تمت استعادة النسخة الاحتياطية بنجاح')}catch(e){console.error(e);toast('فشلت الاستعادة: '+(e.message||''),'e')}}
function toggleAutoBackup(on){localStorage.setItem('cms_auto_backup',on?'1':'0');if(on){runAutoBackup();toast('تم تفعيل النسخ اليومي أثناء تشغيل التطبيق')}else toast('تم إيقاف النسخ التلقائي')}
async function runAutoBackup(){if(localStorage.getItem('cms_auto_backup')!=='1'||!me||SH)return;const last=Number(localStorage.getItem('cms_auto_backup_at')||0);if(Date.now()-last<86400000)return;try{const o=await fullBackup();await storeBackup(o);localStorage.setItem('cms_auto_backup_at',String(Date.now()));toast('تم حفظ النسخة اليومية محليًا')}catch(e){console.warn(e)}}
function legacy(){try{mg(JSON.parse(localStorage.getItem('cms')))}catch(e){toast('لا توجد بيانات قديمة على هذا الجهاز','e')}}
function mg(o){KINDS.forEach(k=>(o[k]||[]).forEach(x=>{const i=D[k].findIndex(y=>y.id==x.id);i<0?D[k].push(x):D[k][i]=x}));if(o.s&&adm())D.s={...DS,...o.s};if(!SH)(o.u||[]).forEach(x=>{if(!D.u.some(y=>y.n==x.n))D.u.push(x)});save();applySet();render();toast('تم الاستيراد')}
function lg(id){const p=D.p.find(x=>x.id==id);p.log=p.log||[];
 openM(`<h3 style="margin-top:0">📝 سجل: ${esc(p.name)}</h3><div style="max-height:45vh;overflow:auto;border-right:3px solid var(--pr);padding-right:12px">${p.log.slice().reverse().map(l=>`<div style="margin-bottom:10px"><div class="mu">${new Date(l.t).toLocaleString('ar-EG')} • ${esc(l.u)}</div>${esc(l.x)}</div>`).join('')||'<p class="mu">لا توجد تعليقات</p>'}</div><textarea id="lx" rows="2" placeholder="أضف تعليقاً..." style="margin-top:10px"></textarea><div class="row"><button class="o" onclick="closeM()">إغلاق</button><button onclick="al('${id}')">إضافة</button></div>`)}
function al(id){const x=$('#lx').value.trim();if(!x)return;const p=D.p.find(y=>y.id==id);(p.log=p.log||[]).push({t:new Date().toISOString(),u:me.n,x,k:'n'});save();lg(id);render()}
const lgp=(p,x)=>(p.log=p.log||[]).push({t:new Date().toISOString(),u:me.n,x,k:'s'});
function rep(k,id){const pr=k=='p'?D.p.find(x=>x.id==id):null,c=D.c.find(x=>x.id==(pr?pr.c:id))||{},ps=pr?[pr]:D.p.filter(x=>x.c==id);
 const h=`<h2>${esc(D.s.name)} — تقرير ${pr?'المشروع':'العميل'}</h2><p>${dfmt(new Date())}</p><h3>${esc(c.name)}</h3><p>${esc(c.code)} • ${esc(c.phone)} • ${esc(c.address||'')}</p>`+ps.map(p=>`<h3>${esc(p.name)} — ${ST[p.s]} (${PT[p.t]})</h3><p>${esc(p.notes||'')}</p>${imgs('قبل',p.bi)}${imgs('بعد',p.ai)}${(p.log||[]).length?`<table><tr><th>التاريخ</th><th>المستخدم</th><th>الحدث</th></tr>${p.log.map(l=>`<tr><td>${dfmt(l.t)}</td><td>${esc(l.u)}</td><td>${esc(l.x)}</td></tr>`).join('')}</table>`:''}`).join('')+(pr?'':`<h3>طلبات الصيانة</h3>`+V.mt(D.m.filter(m=>m.c==id),true));
 $('#rep').innerHTML=`<div class="np row" style="justify-content:flex-start"><button onclick="try{print()}catch(e){toast('الطباعة غير متاحة هنا، احفظ التقرير','e')}">🖨️ طباعة</button><button class="o" onclick="svr()">⬇️ حفظ HTML</button><button class="o" onclick="$('#rep').classList.add('hide')">إغلاق</button></div>`+h;$('#rep').classList.remove('hide');closeM()}
async function svr(){const e=$('#rep').cloneNode(true);e.querySelector('.np').remove();try{const d=await claude.use('downloads');await d.save({filename:'report.html',data:'<!DOCTYPE html><html lang="ar" dir="rtl"><meta charset="utf-8"><body style="font-family:Tahoma">'+e.innerHTML})}catch(x){toast('الحفظ غير متاح هنا','e')}}
const nz=t=>String(t||'').toLowerCase().replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[\u064B-\u0652]/g,'');
function vs(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return toast('البحث الصوتي غير مدعوم في هذا المتصفح','e');const r=new R();r.lang='ar-EG';
 r.onresult=e=>{Q=e.results[0][0].transcript.replace(/[.،]/g,'').trim();render();toast('🎤 '+Q)};r.onerror=e=>toast('تعذر استخدام الميكروفون ('+e.error+')','e');toast('🎤 تكلم الآن...');try{r.start()}catch(e){}}
let IDB=null;try{const q=indexedDB.open('cmsfiles',1);q.onupgradeneeded=()=>q.result.createObjectStore('f');q.onsuccess=()=>IDB=q.result;navigator.storage.persist()}catch(e){}
const idbp=(m,f)=>new Promise((ok,no)=>{const t=IDB.transaction('f',m),r=f(t.objectStore('f'));t.oncomplete=()=>ok(r.result);t.onerror=()=>no(t.error)});
const toB=u=>typeof u=='string'?blob(u):u,MAXF=()=>AS?20e6:(!SH&&IDB?50e6:1.5e6);
const putA=async u=>{if(AS)return put(u);if(!IDB)return typeof u=='string'?u:await rd(u);const k=uid()+uid();try{await idbp('readwrite',st=>st.put(toB(u),k));return 'idb:'+k}catch(e){return typeof u=='string'?u:await rd(u)}};
const furl=async u=>(u||'').startsWith('idb:')?URL.createObjectURL(await idbp('readonly',st=>st.get(u.slice(4)))):u;
const idbDel=k=>{try{idbp('readwrite',st=>st.delete(k))}catch(e){}};
async function opn(id,i){zoom(await furl(D.c.find(x=>x.id==id).att[i].u))}
async function dl(id,i){const a=D.c.find(x=>x.id==id).att[i],l=document.createElement('a');l.href=await furl(a.u);l.download=a.n;l.target='_blank';document.body.appendChild(l);l.click();l.remove()}
applySet();
// Require Supabase authentication on every device; local data remains cached until cloud sign-in.
if(sb){sb.auth.getSession().then(({data})=>{if(data?.session?.user)cloudStart(data.session.user).catch(e=>toast('تعذر فتح الحساب السحابي: '+e.message,'e'))})}
</script>

<script>
let deferredInstallPrompt=null;
const installButton=document.getElementById('installBtn');
function isInstalled(){return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;if(installButton)installButton.style.display='inline-block'});
window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;if(installButton)installButton.style.display='none';toast('تم تثبيت التطبيق بنجاح')});
async function installApp(){
 if(isInstalled())return toast('التطبيق مثبت بالفعل');
 if(deferredInstallPrompt){deferredInstallPrompt.prompt();const choice=await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;if(choice&&choice.outcome==='accepted')toast('جارٍ تثبيت التطبيق');return}
 toast('افتح قائمة المتصفح واختر تثبيت التطبيق أو إضافة إلى الشاشة الرئيسية');
}
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
 window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('Service worker registration failed:',err)));
}
if(isInstalled()&&installButton)installButton.style.display='none';
</script>
